services:

  postgres:
    image: postgres:17
    container_name: helpdesk-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tomcat:
    build:
      context: ./docker/tomcat
    image: lpu-helpdesk-tomcat:11-jdk21
    container_name: helpdesk-tomcat
    ports:
      - "${TOMCAT_PORT:-8082}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bHB1LW1pc2QtaGVscGRlc2stand0LXNlY3JldC1rZXktMzJieXRlcyE=}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_MAIL_FROM: ${MAIL_USERNAME}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://helpdesk.lpulaguna.com}
      APP_ADMIN_BASE_URL: ${APP_ADMIN_BASE_URL:-https://helpdeskadmin.lpulaguna.com}
      APP_MSAL_TENANT_ID: ${APP_MSAL_TENANT_ID:-}
      APP_MSAL_CLIENT_ID: ${APP_MSAL_CLIENT_ID:-}
      APP_ALLOWED_EMAIL_DOMAIN: ${APP_ALLOWED_EMAIL_DOMAIN:-lpulaguna.edu.ph,lpusc.edu.ph}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://10.1.10.12,http://helpdesk.lpu-laguna.edu.ph,http://*.lpu-laguna.edu.ph,https://helpdesk.lpulaguna.com,https://*.lpulaguna.com,https://helpdesk.lpu-laguna.edu.ph,https://*.lpu-laguna.edu.ph}
      GATE_ATTENDANCE_DB_HOST: ${GATE_ATTENDANCE_DB_HOST:-}
      GATE_ATTENDANCE_DB_PORT: ${GATE_ATTENDANCE_DB_PORT:-5432}
      GATE_ATTENDANCE_DB_NAME: ${GATE_ATTENDANCE_DB_NAME:-postgres}
      GATE_ATTENDANCE_DB_USER: ${GATE_ATTENDANCE_DB_USER:-postgres}
      GATE_ATTENDANCE_DB_PASSWORD: ${GATE_ATTENDANCE_DB_PASSWORD:-}
      GATE_ATTENDANCE_URL: ${GATE_ATTENDANCE_URL:-}
      APP_PICTURES_DIR: /usr/local/tomcat/pictures
      JAVA_OPTS: "-Dlpu.log.dir=/usr/local/tomcat/logs"
    volumes:
      # Deploy: mvn -f lpu-helpdesk clean package && cp lpu-helpdesk/target/lpu-helpdesk.war data/tomcat/webapps/
      - ./data/tomcat/webapps:/usr/local/tomcat/webapps
      - ./data/tomcat/logs:/usr/local/tomcat/logs
      - ./data/pictures:/usr/local/tomcat/pictures
    depends_on:
      postgres:
        condition: service_healthy

  angular:
    image: node:24-alpine
    container_name: helpdesk-angular
    working_dir: /app
    volumes:
      - ./frontend:/app
      - angular_node_modules:/app/node_modules
    ports:
      - "${ANGULAR_PORT:-4202}:4200"
    environment:
      BACKEND_URL: http://tomcat:8080
      BACKEND_CONTEXT_PATH: /lpu-helpdesk
      HUSKY: "0"
      CI: "true"
      NG_CLI_ANALYTICS: "false"
      NG_ALLOWED_HOSTS: "*"
      NG_TRUST_PROXY_HEADERS: "X-FORWARDED-FOR,X-FORWARDED-PROTO,X-FORWARDED-HOST"
    # Serve a static build (not ng serve/Vite). Vite HMR embeds localhost:4200 and
    # white-screens LAN hosts such as helpdesk.lpu-laguna.edu.ph → 10.1.10.12.
    # API is still proxied by nginx (/lpu-helpdesk → tomcat).
    command: >-
      sh -c "test -f package.json || { echo 'Missing package.json — mount ./frontend to /app'; exit 1; }
      && npm install
      && npx ng build --watch --configuration development &
      until [ -f dist/lpu-misd-helpdesk/browser/index.html ]; do sleep 1; done
      && npx --yes serve -s dist/lpu-misd-helpdesk/browser -c /app/serve.json -l tcp://0.0.0.0:4200"
    stdin_open: true
    tty: true
    depends_on:
      - tomcat

  web:
    image: nginx:latest
    container_name: helpdesk-web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./data/web/templates:/etc/nginx/templates
    environment:
      NGINX_PORT: 80
      SERVER_NAME: ${SERVER_NAME:-localhost}
      ADMIN_SERVER_NAME: ${ADMIN_SERVER_NAME:-helpdeskadmin.lpulaguna.com}
      LAN_SERVER_NAME: ${LAN_SERVER_NAME:-helpdesk.lpu-laguna.edu.ph 10.1.10.12}
      UPSTREAM_HOST: angular
      UPSTREAM_PORT: 4200
      TOMCAT_HOST: tomcat
      TOMCAT_PORT: 8080
    depends_on:
      - angular
      - tomcat

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: helpdesk-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./data/cloudflared:/etc/cloudflared
    depends_on:
      - web

volumes:
  angular_node_modules:
