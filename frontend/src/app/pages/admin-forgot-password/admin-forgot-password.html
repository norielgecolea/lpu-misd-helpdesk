<div
  class="relative flex min-h-dvh w-full items-center justify-center overflow-hidden bg-[#f6f7fb] p-4 sm:p-6"
>
  <div
    class="absolute inset-0 scale-105 bg-slate-200 bg-cover bg-center"
    style="background-image: url('/background.webp')"
    aria-hidden="true"
  ></div>
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_15%_15%,rgba(141,37,70,0.28),transparent_30%),linear-gradient(120deg,rgba(255,255,255,0.92),rgba(255,255,255,0.68))]"
    aria-hidden="true"
  ></div>

  <div
    class="relative z-10 w-full max-w-md overflow-hidden rounded-3xl bg-white/45 p-8 shadow-[inset_0_1px_0_rgba(255,255,255,0.8),0_16px_40px_-12px_rgba(24,24,27,0.18)] ring-1 ring-inset ring-white/60 backdrop-blur-xl backdrop-saturate-150 sm:p-10"
  >
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <img src="/logo.svg" alt="LPU Laguna" class="h-14 w-14 object-contain" />
      <div>
        <p class="text-primary/80 text-xs font-bold tracking-[0.22em] uppercase">Admin Portal</p>
        <h1 class="text-2xl font-black leading-tight text-gray-950">Forgot password</h1>
      </div>
      <p class="text-sm font-medium text-gray-600">
        Enter your username or email and we’ll send a reset link if an account exists.
      </p>
    </div>

    @if (error()) {
      <p class="mb-4 rounded-lg border border-red-100 bg-red-50 px-3 py-2 text-sm font-medium text-red-600" role="alert">
        {{ error() }}
      </p>
    }
    @if (success()) {
      <p class="mb-4 rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-800" role="status">
        {{ success() }}
      </p>
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-gray-800" for="login">Username or email</label>
        <input
          id="login"
          type="text"
          autocomplete="username"
          class="focus:border-primary/55 focus:ring-primary/35 w-full rounded-lg border border-zinc-950/15 bg-white/80 px-3.5 py-2.5 text-sm text-gray-900 shadow-sm transition-all duration-200 placeholder:text-gray-500 focus:ring-2 focus:outline-none"
          [ngModel]="login()"
          (ngModelChange)="login.set($event)"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="loading()"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="bg-primary border-primary hover:bg-primary/90 mt-2 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg border px-4 py-3 text-sm font-semibold text-white disabled:opacity-50"
      >
        @if (loading()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
          Sending…
        } @else {
          Send reset link
        }
      </button>
    </form>

    <p class="mt-6 text-center text-xs font-medium text-gray-500">
      <a routerLink="/admin" class="text-primary font-semibold hover:underline">Back to sign in</a>
    </p>
  </div>
</div>
