server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lpu-helpdesk
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Lpu-1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SPRING_MAIL_HOST:smtp.office365.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:system.notifications@lpulaguna.edu.ph}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

app:
  jwt:
    # Base64-encoded 256-bit secret (override via APP_JWT_SECRET in production)
    secret: ${APP_JWT_SECRET:bHB1LW1pc2QtaGVscGRlc2stand0LXNlY3JldC1rZXktMzJieXRlcyE=}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}
    # ~10 years — "Remember me" sessions last until explicit logout
    remember-expiration-ms: ${APP_JWT_REMEMBER_EXPIRATION_MS:315360000000}
  otp:
    length: ${APP_OTP_LENGTH:6}
    expiration-minutes: ${APP_OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
  mail:
    from-address: ${APP_MAIL_FROM:system.notifications@lpulaguna.edu.ph}
    from-name: ${APP_MAIL_FROM_NAME:LPU Laguna MISD Helpdesk}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost}
    admin-base-url: ${APP_ADMIN_BASE_URL:http://localhost}
  msal:
    # From Azure Portal -> App registrations -> your app.
    tenant-id: ${APP_MSAL_TENANT_ID:}
    client-id: ${APP_MSAL_CLIENT_ID:}
  auth:
    allowed-email-domain: ${APP_ALLOWED_EMAIL_DOMAIN:lpulaguna.edu.ph,lpusc.edu.ph}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.1.10.12,http://helpdesk.lpu-laguna.edu.ph,http://*.lpu-laguna.edu.ph,https://helpdesk.lpulaguna.com,https://*.lpulaguna.com,https://helpdesk.lpu-laguna.edu.ph,https://*.lpu-laguna.edu.ph}
  gate-attendance:
    # Read-only connection to the gate attendance Postgres (students / employees).
    db-host: ${GATE_ATTENDANCE_DB_HOST:127.0.0.1}
    db-port: ${GATE_ATTENDANCE_DB_PORT:5432}
    db-name: ${GATE_ATTENDANCE_DB_NAME:postgres}
    db-username: ${GATE_ATTENDANCE_DB_USER:postgres}
    db-password: ${GATE_ATTENDANCE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Lpu-1234}}
    # Gate Tomcat base URL used to fetch profile photos server-side (proxy).
    # Browsers receive same-origin HTTPS URLs under /lpu-helpdesk/api/directory/photos/...
    url: ${GATE_ATTENDANCE_URL:}
    pictures-path: ${GATE_ATTENDANCE_PICTURES_PATH:/attendance-system/pictures}
    public-context-path: ${APP_PUBLIC_CONTEXT_PATH:/lpu-helpdesk}
  storage:
    pictures-dir: ${APP_PICTURES_DIR:/usr/local/tomcat/pictures}
    max-id-bytes: ${APP_MAX_ID_BYTES:5242880}

logging:
  config: classpath:log4j2.xml
